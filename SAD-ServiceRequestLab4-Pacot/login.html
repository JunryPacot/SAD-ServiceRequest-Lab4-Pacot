<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Laboratory Asset Management - Login</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script><script src="js/auth.js" defer></script>
</head>
<body class="login-page">
<div class="login-card">
  <div class="logo-box">ICT</div>
  <h1>Laboratory Asset Management</h1>
  <p class="muted">Role-Based Transaction and Approval System</p>
  <form id="loginForm">
    <label>Email</label><input id="email" type="email" required placeholder="Enter your email">
    <label>Password</label><input id="password" type="password" required placeholder="Enter your password">
    <button class="btn btn-primary full-btn" type="submit">Login</button>
    <p id="loginMessage" class="message"></p>
  </form>
</div>
</body></html>
